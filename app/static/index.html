<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Noise Monitor</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root {
  --bg:#fff; --fg:#111; --card:#f4f4f4;
}
body.dark {
  --bg:#121212; --fg:#eee; --card:#1e1e1e;
}
body {
  background:var(--bg); color:var(--fg);
  font-family:system-ui,sans-serif;
  margin:0; padding:20px;
}
.card {
  background:var(--card);
  padding:16px; border-radius:12px;
  margin-bottom:16px;
}
.controls {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:12px;
}
.badge {
  padding:6px 14px;
  border-radius:999px;
  font-weight:600;
}
.green{background:#2ecc71}
.yellow{background:#f1c40f}
.orange{background:#e67e22}
.red{background:#e74c3c;color:#fff}
</style>
</head>

<body>
<header style="display:flex;justify-content:space-between;align-items:center">
  <h1>🔊 Noise Monitor</h1>
  <button onclick="toggleDark()">🌓</button>
</header>

<div class="card">
  <div id="current" style="font-size:3rem">--</div>
  <div id="label" class="badge">--</div>
</div>

<div class="card controls">
  <label>Preset range
    <select id="preset" onchange="applyPreset()">
      <option value="">Custom</option>
      <option value="1">Last hour</option>
      <option value="6">Last 6 hours</option>
      <option value="24">Last 24 hours</option>
      <option value="168">Last 7 days</option>
    </select>
  </label>

  <label>Start
    <input type="datetime-local" id="start">
  </label>

  <label>End
    <input type="datetime-local" id="end">
  </label>

  <label>Quiet hours start
    <input type="time" id="quietStart" value="22:00">
  </label>

  <label>Quiet hours end
    <input type="time" id="quietEnd" value="07:00">
  </label>

  <label>SPL calibration (dB)
    <input type="number" id="cal" value="0">
  </label>

  <button onclick="refresh()">Apply</button>
</div>

<div class="card">
  <canvas id="chart"></canvas>
</div>

<script>
const ctx = document.getElementById("chart").getContext("2d");

function colorFor(db){
  if(db<=-30)return"#2ecc71";
  if(db<=-20)return"#f1c40f";
  if(db<=-10)return"#e67e22";
  return"#e74c3c";
}

const gradient = ctx.createLinearGradient(0,0,0,400);
gradient.addColorStop(0,"rgba(231,76,60,0.35)");
gradient.addColorStop(0.5,"rgba(241,196,15,0.25)");
gradient.addColorStop(1,"rgba(46,204,113,0.2)");

const chart = new Chart(ctx,{
  type:"line",
  data:{labels:[],datasets:[{
    label:"Noise (approx dBA)",
    data:[],
    borderColor:[],
    backgroundColor:gradient,
    fill:true,
    tension:0.25,
    pointRadius:0
  }]},
  options:{
    scales:{
      y:{
        min:20,max:90,
        title:{display:true,text:"dBA (approx)"}
      }
    }
  }
});

function classify(db){
  if(db<=40)return["Comfortable","green"];
  if(db<=55)return["Noticeable","yellow"];
  if(db<=70)return["Loud","orange"];
  return["Excessive","red"];
}

function applyPreset(){
  const h=document.getElementById("preset").value;
  if(!h)return;
  const end=new Date();
  const start=new Date(end.getTime()-h*3600*1000);
  document.getElementById("start").value=start.toISOString().slice(0,16);
  document.getElementById("end").value=end.toISOString().slice(0,16);
}

async function refresh(){
  const start=document.getElementById("start").value;
  const end=document.getElementById("end").value;
  const cal=parseFloat(document.getElementById("cal").value)||0;

  const params=new URLSearchParams();
  if(start)params.append("start",start);
  if(end)params.append("end",end);

  const data=await fetch("/api/history?"+params).then(r=>r.json());

  const labels=[],values=[],colors=[];
  for(const p of data){
    const spl=p.peak_max+cal+100; // relative dBFS→dBA mapping
    labels.push(new Date(p.minute).toLocaleString());
    values.push(spl);
    colors.push(colorFor(spl-100));
  }

  chart.data.labels=labels;
  chart.data.datasets[0].data=values;
  chart.data.datasets[0].borderColor=colors;
  chart.update();

  const latest=values.at(-1);
  if(latest){
    const [label,cls]=classify(latest);
    document.getElementById("current").innerText=
      `${latest.toFixed(1)} dBA`;
    const badge=document.getElementById("label");
    badge.innerText=label;
    badge.className=`badge ${cls}`;
  }
}

function toggleDark(){
  document.body.classList.toggle("dark");
  localStorage.setItem("dark",
    document.body.classList.contains("dark"));
}

if(localStorage.getItem("dark")==="true"){
  document.body.classList.add("dark");
}

applyPreset();
refresh();
</script>
</body>
</html>
